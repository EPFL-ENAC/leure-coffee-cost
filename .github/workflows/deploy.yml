# https://github.com/EPFL-ENAC/epfl-enac-build-push-deploy-action#readme
name: deploy

# Push to `dev` and the cluster gets the new image. There is only one
# deployment, the OLMA one, so no tag or prod overlay.
"on":
  push:
    branches:
      - dev

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: EPFL-ENAC/epfl-enac-build-push-deploy-action/.github/workflows/deploy.yml@v3.0.4
    secrets:
      token: ${{ secrets.CD_TOKEN }}
    with:
      org: epfl-leure
      repo: coffee-cost
